services:
  db:
    image: ankane/pgvector:latest
    container_name: upi_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: upi_db
      POSTGRES_USER: upi_user
      POSTGRES_PASSWORD: upi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server:latest
    container_name: upi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: upi_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://upi_user:upi_password@db:5432/upi_db
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - redis
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: upi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama_data:
