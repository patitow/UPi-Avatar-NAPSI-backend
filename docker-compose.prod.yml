# Produção em casa: stack UPi + Caddy (porta 80) + DDNS Cloudflare (opcional).
#
# Só stack (sem expor API direto na 8000):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Com DDNS (atualiza o A de api.upi.patitow.dev no Cloudflare):
#   Preenche .env (CLOUDFLARE_API_TOKEN, DDNS_DOMAINS, CORS_ORIGINS). Depois:
#   .\compose-prod.ps1 -Ddns
#
# Router: port forward TCP 80 → IP deste PC na LAN.
# Cloudflare DNS: registo A para api.upi (ou o FQDN em DDNS_DOMAINS)
#   com proxy LIGADO (nuvem laranja). O DDNS cria/atualiza o A.
# SSL no Cloudflare: modo "Flexible" (visitante HTTPS → origem HTTP :80).

services:
  api:
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    container_name: upi_caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    container_name: cloudflare-ddns-upi
    profiles: ["ddns"]
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      DOMAINS: ${DDNS_DOMAINS:-api.upi.patitow.dev}
      PROXIED: "true"
      IP6_PROVIDER: "none"
